<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e6e9ef">
<meta name="robots" content="noindex, nofollow, noarchive">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notes">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav" role="tablist" aria-label="화면 선택">
  <button type="button" id="tab-quiz" role="tab" aria-selected="true" aria-controls="view-quiz">
    두문자 암기
  </button>
  <button type="button" id="tab-read" role="tab" aria-selected="false" aria-controls="view-read">
    단문 열람
  </button>
</nav>

<main class="app">

  <section class="view" id="view-quiz" role="tabpanel" aria-labelledby="tab-quiz">
    <div class="bar">
      <select id="f-star" aria-label="별점 조건">
        <option value="0">전체</option>
        <option value="3">★★★ 이상</option>
        <option value="4">★★★★</option>
      </select>
      <select id="f-order" aria-label="순서">
        <option value="seq">번호순</option>
        <option value="random">무작위</option>
      </select>
      <span class="count" id="count"></span>
    </div>

    <button type="button" class="card" id="card" aria-live="polite"></button>

    <div class="pager">
      <button type="button" id="prev">← 이전</button>
      <button type="button" id="next">다음 →</button>
    </div>
  </section>

  <section class="view" id="view-read" role="tabpanel" aria-labelledby="tab-read" hidden>
    <div id="read-body"></div>
  </section>

</main>

<script src="data/a.js"></script>
<script src="data/b.js"></script>
<script src="js/app.js"></script>
</body>
</html>
